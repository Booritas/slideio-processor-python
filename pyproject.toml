[build-system]
requires = ["setuptools>=61", "wheel", "pybind11==3.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "slideio-processor"
dynamic = ["version"]
description = "Python bindings for slideio-processor"
requires-python = ">=3.9"
dependencies = [
    "slideio==2.11.1",
    "numpy",
]

[project.optional-dependencies]
pandas = ["pandas"]

[project.scripts]
slideio-processor = "slideio_processor.cli:main"

[tool.setuptools.packages.find]
include = ["slideio_processor*"]

[tool.setuptools.package-data]
slideio_processor = ["_libs/*"]
