name: Build

# Builds the wheel with the test helpers, installs it next to the pinned slideio wheel and
# runs the test suite from outside the checkout, then checks the pins against the slideio-dist
# repository the slideio wheel comes from. The toolchain setup follows extern/slideio-processor's build-validation.yml.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x86_64
    runs-on: windows-2022
    # A cold cache builds SlideIO and its Conan graph from source. A ceiling, not an estimate.
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        # distro is what SlideIO's install.py reads to pick its Conan profile.
        run: python -m pip install conan distro

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Cache keys
        id: keys
        run: |
          echo "processor=$(git rev-parse HEAD:extern/slideio-processor)" >> "$GITHUB_OUTPUT"
          echo "slideio=$(git -C extern/slideio-processor rev-parse HEAD:extern/slideio)" >> "$GITHUB_OUTPUT"

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-windows-2022-${{ steps.keys.outputs.processor }}-${{ steps.keys.outputs.slideio }}
          restore-keys: |
            conan-windows-2022-

      - name: Cache the SlideIO install
        id: slideio-cache
        uses: actions/cache@v4
        with:
          path: build/slideio-install
          key: slideio-install-windows-2022-${{ steps.keys.outputs.slideio }}

      # SlideIO's Conan profiles pin a compiler version; this rewrites them (and install.py's
      # CMake generator) to the runner's compiler. Only needed when SlideIO is built.
      - name: Sync SlideIO toolchain
        if: steps.slideio-cache.outputs.cache-hit != 'true'
        working-directory: extern/slideio-processor/extern/slideio
        run: python sync-toolchain.py

      # On a cache hit the restored install is used as it is: build_deps.py would otherwise
      # rebuild it, because the toolchain sync of the run that built it dirtied the submodule.
      - name: Prepare dependencies
        run: |
          if [ "${{ steps.slideio-cache.outputs.cache-hit }}" = "true" ]; then
            export SLIDEIO_INSTALL_DIR="$GITHUB_WORKSPACE/build/slideio-install/release"
          fi
          python build_deps.py

      - name: Build the wheel with the test helpers
        env:
          SLIDEIO_PROCESSOR_PYTHON_TEST_HELPERS: '1'
        run: python -m pip wheel . --no-deps -w dist

      - name: Install the wheels
        run: |
          pin=$(python -c "import sys; sys.path.insert(0, 'scripts'); import check_pins; print(check_pins.pinned_slideio(open('pyproject.toml', encoding='utf-8').read()))")
          # Switch to `pip install slideio==$pin` from PyPI once that version is published there.
          python -m pip install --no-cache-dir "https://raw.githubusercontent.com/Booritas/slideio-dist/$pin/$pin/Windows/slideio-$pin-cp312-cp312-win_amd64.whl"
          python -m pip install --no-deps dist/slideio_processor-*.whl
          python -m pip install pytest pillow pandas

      - name: Test from outside the checkout
        run: |
          mkdir -p "$RUNNER_TEMP/pytest-run"
          cd "$RUNNER_TEMP/pytest-run"
          python -m pytest "$GITHUB_WORKSPACE/tests" -v

      - name: Check the pins
        run: python scripts/check_pins.py --online

  manylinux:
    name: manylinux_2_28 x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # As extern/slideio-processor's build-validation.yml does: built inside SlideIO's
      # manylinux image rather than with an image as the job's `container:`. The bare pypa
      # image lacks the system -devel packages SlideIO's Conan graph builds against; this one
      # has them, the gcc 14 toolchain and a Conan cache of SlideIO's dependencies, but no
      # sources. The tag is the one upstream pins. No Actions cache: upstream has none here.
      #
      # The image puts cp311 first on PATH; the slideio wheel is cp312, so cp312 goes first
      # and gets its own conan and distro (the warmed cache in /root/.conan2 is shared).
      # safe.directory: the checkout is owned by the runner user, the container runs as root,
      # and git refuses to touch a repository it does not own.
      - name: Build and test in the manylinux image
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            booritas/slideio-manylinux_2_28_x86_64:2.10.0 \
            bash -c '
              set -euo pipefail
              git config --global --add safe.directory "*"
              export PATH=/opt/python/cp312-cp312/bin:$PATH
              python -m pip install conan distro
              python build_deps.py
              SLIDEIO_PROCESSOR_PYTHON_TEST_HELPERS=1 python -m pip wheel . --no-deps -w dist
              pin=$(python -c "import sys; sys.path.insert(0, \"scripts\"); import check_pins; print(check_pins.pinned_slideio(open(\"pyproject.toml\", encoding=\"utf-8\").read()))")
              # Switch to `pip install slideio==$pin` from PyPI once that version is published there.
              python -m pip install --no-cache-dir "https://raw.githubusercontent.com/Booritas/slideio-dist/$pin/$pin/Linux/slideio-$pin-cp312-cp312-manylinux_2_28_x86_64.whl"
              python -m pip install --no-deps dist/slideio_processor-*.whl
              python -m pip install pytest pillow pandas
              mkdir -p /tmp/pytest-run
              (cd /tmp/pytest-run && python -m pytest /src/tests -v)
              python scripts/check_pins.py --online
            '

  macos-arm64:
    name: macOS arm64
    runs-on: macos-15
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install conan distro

      - name: Cache keys
        id: keys
        run: |
          echo "processor=$(git rev-parse HEAD:extern/slideio-processor)" >> "$GITHUB_OUTPUT"
          echo "slideio=$(git -C extern/slideio-processor rev-parse HEAD:extern/slideio)" >> "$GITHUB_OUTPUT"

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-macos-15-${{ steps.keys.outputs.processor }}-${{ steps.keys.outputs.slideio }}
          restore-keys: |
            conan-macos-15-

      - name: Cache the SlideIO install
        id: slideio-cache
        uses: actions/cache@v4
        with:
          path: build/slideio-install
          key: slideio-install-macos-15-${{ steps.keys.outputs.slideio }}

      - name: Sync SlideIO toolchain
        if: steps.slideio-cache.outputs.cache-hit != 'true'
        working-directory: extern/slideio-processor/extern/slideio
        run: python sync-toolchain.py

      - name: Prepare dependencies
        run: |
          if [ "${{ steps.slideio-cache.outputs.cache-hit }}" = "true" ]; then
            export SLIDEIO_INSTALL_DIR="$GITHUB_WORKSPACE/build/slideio-install/release"
          fi
          python build_deps.py

      - name: Build the wheel with the test helpers
        env:
          SLIDEIO_PROCESSOR_PYTHON_TEST_HELPERS: '1'
        run: python -m pip wheel . --no-deps -w dist

      - name: Install the wheels
        run: |
          pin=$(python -c "import sys; sys.path.insert(0, 'scripts'); import check_pins; print(check_pins.pinned_slideio(open('pyproject.toml', encoding='utf-8').read()))")
          # Switch to `pip install slideio==$pin` from PyPI once that version is published there.
          python -m pip install --no-cache-dir "https://raw.githubusercontent.com/Booritas/slideio-dist/$pin/$pin/MacOS/arm/slideio-$pin-cp312-cp312-macosx_12_0_arm64.whl"
          python -m pip install --no-deps dist/slideio_processor-*.whl
          python -m pip install pytest pillow pandas

      - name: Test from outside the checkout
        run: |
          mkdir -p "$RUNNER_TEMP/pytest-run"
          cd "$RUNNER_TEMP/pytest-run"
          python -m pytest "$GITHUB_WORKSPACE/tests" -v

      - name: Check the pins
        run: python scripts/check_pins.py --online
